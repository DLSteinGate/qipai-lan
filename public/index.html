<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="局域网棋牌室 · 斗地主与广东推倒胡，同一局域网浏览器直连，无需安装">
<title>局域网棋牌室</title>
<link rel="preload" href="/fonts/fusion-12px-zh_hans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23070a0f'/><text x='50' y='50' font-size='64' fill='%23ffc94a' text-anchor='middle' dominant-baseline='central' font-family='monospace'>中</text></svg>">
</head>
<body>

<!-- 顶部状态条 -->
<header class="topbar" id="topbar">
  <div class="brand" id="brand"><span class="led"></span>局域网棋牌室</div>
  <div class="roomInfo" id="roomInfo"></div>
  <div class="topRight">
    <span class="me" id="meInfo"></span>
    <button class="ghost sm" id="btnLeave" hidden>退出</button>
  </div>
</header>

<!-- ========== 首页 ========== -->
<section class="screen" id="screen-home">
  <div class="homeWrap">
    <div class="hero">
      <div class="kicker">LOCAL NETWORK</div>
      <div class="heroIcon"><span>中</span></div>
      <h1>局域网棋牌室</h1>
      <p class="sub">斗地主 · 广东推倒胡 · 同一局域网直接联机<br>想自己先打一局？点下面「立即开一局」</p>
    </div>

    <div class="panel">
      <button class="quickPlay" id="btnQuick">
        <b>⚡ 立即开一局</b>
        <small>斗地主 · 和 2 个电脑打，不用等人</small>
      </button>

      <label class="field">
        <span>你的昵称（留空就用「玩家」）</span>
        <input id="inputName" maxlength="8" placeholder="随便起个名字" value="">
      </label>

      <div class="createRow">
        <button class="big primary" data-create="ddz">
          <b>斗地主</b>
          <small>3 人 · 一副牌</small>
        </button>
        <button class="big primary" data-create="mahjong">
          <b>麻将</b>
          <small>2~4 人 · 推倒胡</small>
        </button>
      </div>

      <div class="divider"><span>或者加入朋友的房间</span></div>

      <div class="joinRow">
        <input id="inputRoom" maxlength="6" placeholder="房间号，如 A3KP" autocomplete="off">
        <button class="primary" id="btnJoin">加入</button>
      </div>

      <div class="lanHint" id="lanHint"></div>
    </div>

    <div class="tips">
      <p>同一局域网内，别人用浏览器打开下面地址即可进来（无需安装任何东西）：</p>
      <div class="addrList" id="addrList"></div>
    </div>
  </div>
</section>

<!-- ========== 房间大厅 ========== -->
<section class="screen" id="screen-lobby" hidden>
  <div class="lobbyWrap">
    <div class="lobbyCard">
      <div class="roomCode">
        <span class="label">房间号</span>
        <strong id="lobbyRoomId">----</strong>
        <button class="ghost sm" id="btnCopyRoom">复制</button>
      </div>
      <div class="gameTag" id="lobbyGame"></div>

      <div class="seatGrid" id="lobbySeats"></div>

      <div class="lobbyActions">
        <button class="ghost" id="btnAddAI">＋ 补一个 AI</button>
        <button class="ghost" id="btnRemoveAI">－ 去掉 AI</button>
        <button class="primary big2" id="btnStart" disabled>开始游戏</button>
      </div>
      <div class="lobbyTip" id="lobbyTip"></div>
    </div>
  </div>
</section>

<!-- ========== 游戏桌面 ========== -->
<section class="screen" id="screen-game" hidden>
  <div class="tableWrap" id="tableWrap"></div>
</section>

<!-- 结算遮罩 -->
<div class="overlay" id="overlay" hidden>
  <div class="overlayCard" id="overlayCard"></div>
</div>

<!-- 提示 / 报错 -->
<div class="toast" id="toast"></div>

<script src="/js/net.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/games/ddz-view.js"></script>
<script src="/js/games/mahjong-view.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
